name: Sync QX icons

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - ".github/workflows/sync-icons.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Fetch latest official App Store artwork and utility icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request, datetime, base64
          from PIL import Image, ImageOps, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          ROOT = Path(".")
          APP_DIR = ROOT / "icons" / "apps"
          UTIL_DIR = ROOT / "icons" / "utility"
          SUB_DIR = ROOT / "icons" / "subscriptions"
          QX_APP_DIR = ROOT / "icons" / "qx" / "apps"
          QX_UTIL_DIR = ROOT / "icons" / "qx" / "utility"
          QX_SUB_DIR = ROOT / "icons" / "qx" / "subscriptions"
          APP_DIR.mkdir(parents=True, exist_ok=True)
          UTIL_DIR.mkdir(parents=True, exist_ok=True)
          QX_APP_DIR.mkdir(parents=True, exist_ok=True)
          QX_UTIL_DIR.mkdir(parents=True, exist_ok=True)
          QX_SUB_DIR.mkdir(parents=True, exist_ok=True)

          # Official Apple App Store track IDs. Artwork is fetched from Apple's
          # Lookup API on each run, so the repo follows the current App Store icon.
          apps = {
              "ChatGPT": 6448311069,
              "Claude": 6473753684,
              "Gemini": 6477489729,
              "Google": 284815942,
              "X": 333903271,
              "Telegram": 686449807,
              "Instagram": 389801252,
              "Reddit": 1064216828,
              "GitHub": 1477376905,
              "TikTok": 835599320,
              "Emby": 992180193,
              "Speedtest": 300704847,
              "Netflix": 363590051,
          }

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def download(url, path):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
              if not data:
                  raise RuntimeError(f"empty response: {url}")
              path.write_bytes(data)

          meta = {
              "source": "Apple iTunes Lookup API",
              "country": "us",
              "synced_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "apps": {}
          }

          for name, app_id in apps.items():
              data = get_json(f"https://itunes.apple.com/lookup?id={app_id}&country=us")
              if not data.get("results"):
                  raise RuntimeError(f"No App Store result for {name} ({app_id})")
              item = data["results"][0]
              artwork = item.get("artworkUrl512") or item.get("artworkUrl100")
              if not artwork:
                  raise RuntimeError(f"No artwork URL for {name}")
              download(artwork, APP_DIR / f"{name}.jpg")
              meta["apps"][name] = {
                  "trackId": item.get("trackId"),
                  "trackName": item.get("trackName"),
                  "sellerName": item.get("sellerName"),
                  "version": item.get("version"),
                  "currentVersionReleaseDate": item.get("currentVersionReleaseDate"),
                  "artworkUrl512": artwork,
              }

          # Oasisic reorganized its tree into per-icon subfolders. Mirror the
          # current stable paths into this repo so QX never depends on a third
          # party icon URL at runtime.
          base = "https://raw.githubusercontent.com/Hawaiine/Oasisic-Icons/main/icons"
          utility = {
              "US.png": f"{base}/Country/US/US.png",
              "Japan.png": f"{base}/Country/Japan/Japan.png",
              "Singapore.png": f"{base}/Country/Singapore/Singapore.png",
              "HongKong.png": f"{base}/Country/HongKong/HongKong.png",
              "Taiwan.png": f"{base}/Country/CN-Taiwan/CN-Taiwan.png",
              "Korea.png": f"{base}/Country/Korea/Korea.png",
              "Turkey.png": f"{base}/Country/Turkey/Turkey.png",
              "China.png": f"{base}/Country/China/China.png",
              "Auto.png": f"{base}/General/Auto/Auto.png",
              "Blacklist.png": f"{base}/General/Blacklist/Blacklist.png",
              "Global-1.png": f"{base}/General/Global/Global.png",
              "Global-2.png": f"{base}/General/Global/Global01.png",
              "Cryptocurrency.png": f"{base}/Crypto/Cryptocurrency/Cryptocurrency.png",
              "WeChatPayCoupon.png": "https://raw.githubusercontent.com/FoKit/Scripts/main/images/wechat_pay_coupon.png",
          }

          utility_errors = {}
          for filename, url in utility.items():
              try:
                  download(url, UTIL_DIR / filename)
                  print(f"Synced utility {filename}")
              except Exception as e:
                  utility_errors[filename] = str(e)
                  print(f"WARNING: skip utility {filename}: {e}")

          def qx_png(src, dst, circular=False):
              with Image.open(src) as im:
                  im = ImageOps.fit(im.convert("RGBA"), (108, 108), method=Image.Resampling.LANCZOS)
                  if circular:
                      # QX shows policy icons in a circular visual slot. Build a true
                      # RGBA circle with transparent corners instead of a square/squircle.
                      scale = 4
                      mask = Image.new("L", (108 * scale, 108 * scale), 0)
                      from PIL import ImageDraw, ImageChops
                      draw = ImageDraw.Draw(mask)
                      pad = 5 * scale
                      draw.ellipse((pad, pad, 108 * scale - pad - 1, 108 * scale - pad - 1), fill=255)
                      mask = mask.resize((108, 108), Image.Resampling.LANCZOS)
                      alpha = im.getchannel("A")
                      im.putalpha(ImageChops.multiply(alpha, mask))
                  im.save(dst, format="PNG", optimize=True)

          # Quantumult X remote policy/server icons are normalized to exact
          # 108x108 PNG files. Keep originals untouched and publish QX-ready
          # derivatives under icons/qx/.
          for name in apps:
              src = APP_DIR / f"{name}.jpg"
              # Replace the canonical QX file with a true circular PNG and also
              # publish a versioned filename so QX can bypass stale image cache.
              qx_png(src, QX_APP_DIR / f"{name}.png", circular=True)
              qx_png(src, QX_APP_DIR / f"{name}-circle-v2.png", circular=True)

          for src in UTIL_DIR.glob("*.png"):
              qx_png(src, QX_UTIL_DIR / src.name)

          subscription_files = {
              "Liangxin.png": "Liangxin.png",
              "Haita.png": "Haita.png",
              "Yuetutu.png": "Yuetutu.png",
              "DMIT.png": "DMIT.png",
              "RN-VPS.png": "RN-VPS.png",
          }
          # Repair the Haita source with the verified 108x108 PNG snapshot.
          (SUB_DIR / "Haita.png").write_bytes(base64.b64decode(""))
          for src_name, dst_name in subscription_files.items():
              src = SUB_DIR / src_name
              if not src.exists():
                  raise RuntimeError(f"Missing subscription icon: {src}")
              qx_png(src, QX_SUB_DIR / dst_name, circular=True)
              stem = Path(dst_name).stem
              qx_png(src, QX_SUB_DIR / f"{stem}-circle-v2.png", circular=True)

          meta["utility_errors"] = utility_errors
          meta["qx_icon_format"] = "PNG 108x108 RGBA; app/subscription icons circular with transparent corners"
          (APP_DIR / "appstore-meta.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit refreshed icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/apps icons/utility icons/qx
          if git diff --cached --quiet; then
            echo "No icon changes."
          else
            git commit -m "Sync latest App Store and utility icons [skip ci]"
            git push
          fi
